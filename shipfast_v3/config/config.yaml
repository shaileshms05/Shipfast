# ShipFast v3.0 Configuration

api:
  host: "0.0.0.0"
  port: 8000
  reload: true
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5000"
  
ai:
  provider: "cerebras"
  api_key_env: "CEREBRAS_API_KEY"
  model: "llama3.1-8b"
  temperature: 0.7
  max_tokens: 8000
  timeout: 120
  
agents:
  shipfast:
    requirements:
      enabled: true
      model: "llama3.1-8b"
    architect:
      enabled: true
      model: "llama3.1-8b"
    coder:
      enabled: true
      model: "llama3.1-8b"
    reviewer:
      enabled: true
      model: "llama3.1-8b"
    integrator:
      enabled: true
      model: "llama3.1-8b"
    deployer:
      enabled: true
      model: "llama3.1-8b"
  
  deploy:
    analyzer:
      enabled: true
    security:
      enabled: true
    configurator:
      enabled: true
    provisioner:
      enabled: true
    
security:
  scanners:
    checkov:
      enabled: true
      fail_on_critical: true
    trivy:
      enabled: false  # Optional
      fail_on_high: false
    secrets:
      enabled: true
      fail_on_found: true
  
storage:
  type: "memory"  # memory, redis, postgres
  artifacts_dir: "./shipfast_output"
  logs_dir: "./logs"
  cache_ttl: 3600
  
workflow:
  auto_proceed: true
  require_approval:
    - "deployment"
  retry_attempts: 3
  retry_delay: 5
  
logging:
  level: "INFO"
  format: "json"
  file_enabled: true
